name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 型チェック / Lint / テスト / ビルド
    runs-on: ubuntu-latest

    env:
      # CI では外部サービスを使わずデモモードのまま検証する
      SPY_SESSION_SECRET: ci-only-secret-not-used-in-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: テスト
        run: npm run test

      - name: 本番ビルド
        run: npm run build
